on: [push, pull_request]
name: Build and Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.19.x, 1.23.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Build
      run: |
        make build

    - name: Test
      run: |
        make test

    # veil fork only: plugin specs live outside ./internal and ./cmd, so
    # `make test` (unchanged from upstream) doesn't run them.
    - name: Test plugins
      run: |
        go test ./plugins/...
